[package]
name = "golaberto-odds"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[workspace]
members = [".", "core", "proposals", "player-ratings"]
default-members = [".", "core", "proposals", "player-ratings"]
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
mysql = { version = "26", default-features = false, features = ["minimal-rust", "chrono", "buffer-pool"] }
tiny_http = "0.12"
smallvec = "1.10.0"
player-ratings = { package = "golaberto-player-ratings", path = "player-ratings" }
golaberto-odds-core = { path = "core" }
golaberto-odds-proposals = { path = "proposals" }

[dev-dependencies]
sha2 = "0.10"
golaberto-odds-core = { path = "core", features = ["test-support"] }
golaberto-odds-proposals = { path = "proposals", features = ["test-support"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[lib]
name = "golaberto_odds"
path = "src/lib.rs"

[[bin]]
name = "golaberto-odds"
path = "src/main.rs"
