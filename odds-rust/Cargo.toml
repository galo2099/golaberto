[package]
name = "golaberto-odds"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[lib]
name = "golaberto_odds"
path = "src/lib.rs"

[[bin]]
name = "golaberto-odds"
path = "src/main.rs"
